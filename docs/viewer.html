<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 3 CAD viewer</title>
<style>
:root{--bg:#F4F6F8;--panel:#FFFFFF;--ink:#16335B;--muted:#4E5A68;--line:#D5DCE4;--accent:#1565D8;--amber:#E8A33D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0}
canvas{display:block}
header{position:fixed;left:16px;top:12px;right:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none}
header>*{pointer-events:auto}
h1{font-size:20px;margin:0}
a.back{color:var(--accent);font-size:14px;text-decoration:none}
#demos{display:flex;gap:8px;flex-wrap:wrap}
#demos a{font-size:14px;background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;padding:7px 12px;font-weight:bold}
#bar{position:fixed;left:16px;right:16px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label{font-size:14px;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#info{position:fixed;right:16px;top:56px;width:min(340px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.45}
#info h2{font-size:15px;margin:0 0 6px}
#info{max-height:calc(100% - 140px);overflow:auto}
#info.collapsed{display:none}
#info table.bom{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px}
#info table.bom th{text-align:left;color:var(--muted);font-weight:normal;border-bottom:1px solid var(--line);padding:2px 3px;position:sticky;top:-12px;background:var(--panel)}
#info table.bom td{border-bottom:1px solid #EEF1F4;padding:2px 3px;vertical-align:top}
#info table.bom td.g{background:#F4F6F8;font-weight:bold;color:var(--ink)}
#info table.bom a{color:var(--accent);text-decoration:none}
#info table.bom input{margin:0}
#bomBtn[hidden]{display:none}
#info ul{margin:6px 0 0;padding-left:18px}
#caption{position:fixed;left:0;right:0;top:46%;text-align:center;font-weight:bold;font-size:40px;color:var(--ink);opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 0 8px var(--bg)}
#tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
#tabs button{border:0;padding:6px 12px}
#steps{position:fixed;right:16px;top:56px;bottom:72px;width:min(400px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.45;overflow:auto;display:flex;flex-direction:column;gap:8px}
#steps[hidden]{display:none}
#steps .sh{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
#steps .sw{background:#FCEFD9;color:#7A4A00;border-radius:10px;padding:2px 8px;font-size:12px}
#steps h2{font-size:18px;margin:0}
#steps .cmd{background:#E2EDFC;border-radius:8px;padding:8px 10px}
#steps .cmd b{display:block;font-size:16px}
#steps .cmd span{font-size:12.5px;color:var(--muted)}
#steps ol{margin:0;padding-left:20px}
#steps ol li{margin:3px 0}
#steps .note{margin:0;border-left:3px solid var(--amber);padding:2px 0 2px 10px;color:var(--muted)}
#legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
#legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
#steps .next{margin:0;color:var(--muted)}
#steps .nav{display:flex;align-items:center;gap:8px;margin-top:auto;padding:6px 0 2px;position:sticky;bottom:-14px;background:var(--panel)}
#steps .nav button{flex:none}
#steps .nav button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#steps .nav button:disabled{opacity:.4;cursor:default}
#dots{display:flex;flex-wrap:wrap;gap:4px;flex:1;justify-content:center}
#dots button{width:26px;height:26px;padding:0;border-radius:50%;font-size:12px}
#dots button.done{background:#E2EDFC}
#steps label{border:0;padding:0}
#steps .sum{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;background:#F4F6F8;border-radius:8px;padding:8px 10px;font-size:13px}
#steps .sum b{display:block;color:var(--muted);font-weight:normal;font-size:12px}
#steps .scale{width:100%}
#steps .scale .bar{height:12px;border-radius:6px;margin:4px 0 2px}
#steps .scale .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
#steps .slider{display:flex;flex-direction:column;align-items:stretch;gap:2px}
#steps .hint{font-size:12px;color:var(--muted);margin:-4px 0 4px}
#feaCtl[hidden],#summary[hidden],#changesL[hidden],#simCtl[hidden],#tabs button[hidden]{display:none}
#simCtl .simrow{display:flex;gap:8px;align-items:center}
#simCtl .simrow input{flex:1}
#simCtl .simrow span{font-variant-numeric:tabular-nums;font-size:13px;width:52px;text-align:right}
#simGraph{width:100%;height:150px;display:block;margin-top:6px}
#simVals{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
#steps .story{background:#F4F6F8;border-radius:8px;padding:8px 10px;font-size:13.5px}
body.steps #info,body.steps #explodeL,body.steps #sectionL{display:none!important}
body.render header,body.render #bar,body.render #info{display:none}
body.render #caption{top:auto;bottom:3.5%;font-size:44px;transition:none}
@media (max-width:640px){#info:not(.open){display:none}#info.open{display:block;top:auto;bottom:64px;max-height:55vh}#caption{font-size:28px}#steps{top:auto;bottom:12px;left:16px;right:16px;width:auto;max-height:52vh}body.steps #bar{display:none}h1{font-size:16px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<div id="stage"></div>
<header><a class="back" href="index.html">All models</a><h1 id="title">Loading…</h1>
  <nav id="tabs"><button data-tab="view" class="on">3D viewer</button><button data-tab="steps">Build steps (Inventor)</button><button data-tab="sim">Simulation (Inventor)</button><button data-tab="fea">FEA (Stress Analysis)</button></nav><span id="demos"></span></header>
<div id="info"></div>
<div id="caption"></div>
<div id="steps" hidden>
  <div class="sh"><span id="stepCount"></span><span class="sw" id="badge">Autodesk Inventor</span></div>
  <h2 id="stepTitle"></h2>
  <div class="cmd"><b id="cmdName"></b><span id="cmdPath"></span></div>
  <ol id="stepActions"></ol>
  <p id="stepNote" class="note"></p>
  <div id="legend"></div>
  <div id="feaCtl" hidden><label class="slider">Deformation scale <input type="range" id="defScale" min="0" max="3" step="0.05" value="1"></label><div id="defLabel" class="hint"></div>
    <label><input type="checkbox" id="showMesh"> Show the mesh</label></div>
  <div id="simCtl" hidden><div class="simrow"><button id="simPlay">Play</button><input type="range" id="simTime" min="0" max="6" step="0.01" value="0"><span id="simTimeL">0.00 s</span></div>
    <canvas id="simGraph" height="150"></canvas><div id="simVals"></div></div>
  <div id="summary" hidden></div>
  <p id="stepNext" class="next"></p>
  <label id="changesL"><input type="checkbox" id="changes" checked> Highlight what this step changes</label>
  <div class="nav"><button id="prev">Previous</button><div id="dots"></div><button id="next" class="primary">Next step</button></div>
</div>
<div id="bar">
  <button data-view="iso" class="on">Isometric</button>
  <button data-view="front">Front view</button>
  <button data-view="plan">Plan</button>
  <button data-view="right">End view (right)</button>
  <button data-view="left">End view (left)</button>
  <label><input type="checkbox" id="persp"> Perspective</label>
  <label><input type="checkbox" id="edges" checked> Edges</label>
  <label id="explodeL"><span>Explode</span><input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
  <label id="sectionL"><input type="checkbox" id="section"> Section A-A</label>
  <button id="spin">Spin</button>
  <button id="bomBtn" hidden>Parts list</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/controls/OrbitControls.js';
import { GLTFLoader } from './vendor/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const NAME = q.get('m') || 'step_block';
// step-by-step lesson demonstrations that use this model
const DEMOS = {
  vee_block: [['auxiliary.html?m=vee_block', 'How an auxiliary view works'], ['scale.html?m=vee_block', 'Scale']],
  sloping_block: [['auxiliary.html', 'How an auxiliary view works'], ['scale.html?m=sloping_block', 'Scale']],
  step_block: [['lines.html', 'Line types on a real view'], ['scale.html', 'Scale']],
};
if (!RENDER_MODE()) document.getElementById('demos').innerHTML = (DEMOS[NAME] || []).map(d => `<a href="${d[0]}">${d[1]}</a>`).join('');
function RENDER_MODE() { return new URLSearchParams(location.search).has('render'); }
const RENDER = q.has('render');
const BG = '#' + (q.get('bg') || 'F4F6F8');
if (RENDER) document.body.classList.add('render');
document.documentElement.style.setProperty('--bg', BG);

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(RENDER ? 1 : Math.min(2, window.devicePixelRatio));
renderer.localClippingEnabled = true;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a96a3, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(2, 3, 2.5); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.6); fill.position.set(-3, 1, -2); scene.add(fill);

let cam, ortho, persp, controls, size = 100, sizeA = 100, sizeE = 100, centre = new THREE.Vector3(), centre0 = new THREE.Vector3();
const root = new THREE.Group(); scene.add(root);
const parts = [];             // {node, edges, offset}
let catalogueEntry = null, BASE = '';   // BASE: the project folder holding this model's files ('' for hub models)

// clipping for section A-A: cut on the CAD XZ plane (glTF XY plane), keep the back half
const clip = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
let sectionOn = false;

function setSize() {
  const w = RENDER ? +(q.get('w') || 1280) : innerWidth, h = RENDER ? +(q.get('h') || 720) : innerHeight;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px'; renderer.domElement.style.height = h + 'px';
  // in the Build steps tab, centre the model in the space the step panel leaves free
  let sx = 0, sy = 0, k = 1;
  const panel = document.getElementById('steps');
  if (!RENDER && document.body.classList.contains('steps') && !panel.hidden) {
    const r = panel.getBoundingClientRect();
    if (w > 640) { sx = (r.width + 16) / 2; k = Math.min(2, w / Math.max(1, w - r.width - 32)); }
    else {
      const top = document.querySelector('header').getBoundingClientRect().bottom + 8, bottom = r.top - 8;
      sy = h / 2 - (top + bottom) / 2; k = Math.min(3, h / Math.max(80, bottom - top));
    }
  }
  const a = w / h, s = size * 0.92 * k;
  ortho.left = -s * a; ortho.right = s * a; ortho.top = s; ortho.bottom = -s; ortho.updateProjectionMatrix();
  persp.aspect = a; persp.updateProjectionMatrix();
  for (const c of [ortho, persp]) { if (sx || sy) c.setViewOffset(w, h, sx, sy, w, h); else c.clearViewOffset(); }
}

const VIEWS = {
  iso: new THREE.Vector3(1, 1, 1),        // CAD (1,-1,1) in glTF axes
  front: new THREE.Vector3(0, 0, 1),
  plan: new THREE.Vector3(0, 1, 0.0001),
  right: new THREE.Vector3(1, 0, 0),
  left: new THREE.Vector3(-1, 0, 0),
};
const CAPTIONS = { iso: 'Isometric view', front: 'Front view', plan: 'Plan', right: 'End view from the right', left: 'End view from the left' };

function camPos(dir, dist) { return centre.clone().add(dir.clone().normalize().multiplyScalar(dist)); }
function placeCamera(dir) {
  for (const c of [ortho, persp]) {
    c.position.copy(camPos(dir, size * 3));
    c.up.set(0, 1, 0);
    c.lookAt(centre);
  }
  controls.target.copy(centre); controls.update();
}
function useCamera(c) { const d = cam ? cam.position.clone().sub(centre) : VIEWS.iso.clone(); cam = c; controls.object = c; c.position.copy(camPos(d, size * 3)); c.lookAt(centre); controls.update(); }

function applyExplode(t) {
  if (ortho) { size = sizeA + (sizeE - sizeA) * t; setSize(); }
  for (const p of parts) {
    const o = p.offset;
    p.node.position.set(o[0] * t, o[1] * t, o[2] * t);
    if (p.edges) p.edges.position.copy(p.node.position);
  }
}
function applySection(on, depth = 0) {
  sectionOn = on;
  clip.constant = centre.z + depth;   // keeps glTF z <= centre + depth, that is the back half
  for (const p of parts) {
    const cut = on && !p.standard;          // standard parts (bolts, pins, rods, springs) are not sectioned
    for (const m of p.mats) m.clippingPlanes = cut ? [clip] : [];
    if (p.edges) p.edges.material.clippingPlanes = cut ? [clip] : [];
    p.cap.visible = cut;
  }
}
function caption(text) {
  const c = document.getElementById('caption');
  c.textContent = text || ''; c.style.opacity = text ? 1 : 0;
}

// parts list (bill of materials) for an assembly: item, part (opens its own model), quantity, show or hide
const GROUP_NAMES = { frame: 'Gate leaf frame (welded)', leaf: 'Fitted to each leaf', hinge: 'Hinges and position sensor',
  drive: 'Drive', chamber: 'Chamber, controls and CCTV', civil: 'Civil works' };
function bomTable(rows) {
  let g = null, html = '<table class="bom"><tr><th>Item</th><th>Part</th><th>Qty</th><th>Show</th></tr>';
  rows.forEach((r, i) => {
    if (r.group !== g) { g = r.group; html += `<tr><td class="g" colspan="4">${GROUP_NAMES[g] || g}</td></tr>`; }
    html += `<tr title="${r.material}"><td>${r.no}</td><td>${r.model ? `<a href="viewer.html?m=${r.model}">${r.name}</a>` : r.name}${r.bought ? ' <span style="color:var(--muted)">(bought in)</span>' : ''}</td>` +
            `<td>${r.qty}</td><td><input type="checkbox" data-row="${i}" checked aria-label="Show ${r.name}"></td></tr>`;
  });
  return html + '</table><div style="font-size:12px;color:var(--muted);margin-top:4px">' + (rows.some(r => r.model) ? 'Click a part to open it on its own. ' : '') + 'Untick to hide it.</div>';
}
function setShown(name, on) {
  const p = parts.find(pp => pp.name === name); if (!p) return;
  p.hidden = !on; p.node.visible = on;
  if (p.edges) p.edges.visible = on && document.getElementById('edges').checked;
}
// "Parts list" opens the info panel at the parts list. On a phone the panel sits between the header and the
// button bar (the bar wraps onto several rows there), and a second press closes it. On a desktop the panel is
// already open, so the first press scrolls to the list and a press while the list is showing hides the panel.
document.getElementById('bomBtn').onclick = () => {
  const info = document.getElementById('info'), table = info.querySelector('table.bom');
  const toList = () => { if (table) info.scrollTop = table.offsetTop - 8; };
  if (matchMedia('(max-width:640px)').matches) {
    if (info.classList.toggle('open')) {
      const top = document.querySelector('header').getBoundingClientRect().bottom + 8;
      const bottom = innerHeight - document.getElementById('bar').getBoundingClientRect().top + 8;
      info.style.bottom = bottom + 'px'; info.style.maxHeight = Math.max(160, innerHeight - top - bottom) + 'px';
      toList();
    }
  } else if (info.classList.contains('collapsed')) { info.classList.remove('collapsed'); toList(); }
  else if (table && Math.abs(info.scrollTop - (table.offsetTop - 8)) > 20 && info.scrollHeight > info.clientHeight) toList();
  else info.classList.add('collapsed');
};

async function load() {
  const cat = await (await fetch('models.json')).json();
  catalogueEntry = cat.find(e => e.name === NAME) || cat[0];
  BASE = catalogueEntry.base || '';
  document.getElementById('title').textContent = catalogueEntry.title;
  document.title = catalogueEntry.title + ' · Unit 3 CAD viewer';
  const info = document.getElementById('info');
  info.innerHTML = `<h2>${catalogueEntry.title}</h2><div>${catalogueEntry.description}</div>
    <div style="margin-top:6px"><b>Criteria:</b> ${catalogueEntry.criteria}</div>
    <div><b>Use it for:</b> ${catalogueEntry.uses}</div>
    ${catalogueEntry.bom ? bomTable(catalogueEntry.bom) : `<ul>${catalogueEntry.parts.map(p => `<li><span style="color:${p.colour}">&#9632;</span> ${p.name}</li>`).join('')}</ul>`}
    <div style="margin-top:6px"><a href="${catalogueEntry.files.step}">STEP</a> · <a href="${catalogueEntry.files.stl}">STL</a></div>`;
  if (catalogueEntry.bom) document.getElementById('bomBtn').hidden = false;
  if (!catalogueEntry.exploded) document.getElementById('explodeL').style.display = 'none';
  if (!catalogueEntry.section) document.getElementById('sectionL').style.display = 'none';

  const gltf = await new GLTFLoader().loadAsync(catalogueEntry.files.glb);
  const edges = await (await fetch(catalogueEntry.files.edges)).json();
  const nodes = [];
  gltf.scene.traverse(o => { if (o.isMesh) nodes.push(o); });
  for (const spec of catalogueEntry.parts) {
    const mesh = nodes.find(n => n.name === spec.name || (n.parent && n.parent.name === spec.name)) || nodes[parts.length];
    const col = new THREE.Color(spec.colour);
    const mat = new THREE.MeshStandardMaterial({ color: col, metalness: 0.15, roughness: 0.55, side: THREE.FrontSide,
                                                 polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    const geom = mesh.geometry;
    const node = new THREE.Mesh(geom, mat);
    // section cap: back faces drawn flat in a darker tone show the cut material
    const capMat = new THREE.MeshBasicMaterial({ color: col.clone().lerp(new THREE.Color(0xffffff), 0.25), side: THREE.BackSide });
    // hatching on the cut face: thin dark lines at 45 degrees, drawn in screen space
    const hatchSign = parts.filter(pp => !pp.standard).length % 2 ? '-' : '+';   // touching parts hatch in opposite directions
    capMat.onBeforeCompile = sh => {
      sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>',
        'float hk = mod(gl_FragCoord.x ' + hatchSign + ' gl_FragCoord.y + 2000.0, 10.0);\n if (hk < 1.6) gl_FragColor.rgb *= 0.25;\n#include <dithering_fragment>');
    };
    capMat.customProgramCacheKey = () => 'hatch' + hatchSign;
    const cap = new THREE.Mesh(geom, capMat); cap.visible = false; node.add(cap);
    root.add(node);
    let eLines = null;
    const pls = edges[spec.name] || [];
    if (pls.length) {
      const pos = [];
      for (const pl of pls) for (let i = 0; i + 5 < pl.length; i += 3) pos.push(pl[i], pl[i + 1], pl[i + 2], pl[i + 3], pl[i + 4], pl[i + 5]);
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      eLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x1D2B3A }));
      root.add(eLines);
    }
    const standard = /bolt|nut|washer|pin|rod|spring/i.test(spec.name) && catalogueEntry.parts.length > 1;
    parts.push({ name: spec.name, node, edges: eLines, offset: spec.explode, mats: [mat, capMat], cap, standard, base: col.clone() });
  }
  if (catalogueEntry.iso) VIEWS.iso = new THREE.Vector3(...catalogueEntry.iso);
  for (const n of catalogueEntry.hide || []) setShown(n, false);
  document.querySelectorAll('#info input[data-row]').forEach(cb => {
    const row = catalogueEntry.bom[+cb.dataset.row];
    cb.checked = row.instances.some(n => !(catalogueEntry.hide || []).includes(n));
    cb.onchange = () => row.instances.forEach(n => setShown(n, cb.checked));
  });
  const box = new THREE.Box3().setFromObject(root);
  box.getCenter(centre); centre0 = centre.clone();
  const solid = box.getSize(new THREE.Vector3()).length();
  sizeA = solid * 0.62; sizeE = sizeA;
  if (catalogueEntry.exploded) {
    applyExplode(1); const eb = new THREE.Box3().setFromObject(root); applyExplode(0);
    sizeE = Math.max(sizeA, eb.getSize(new THREE.Vector3()).length() * 0.58);
  }
  size = sizeA;
  ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, size * 20);
  persp = new THREE.PerspectiveCamera(35, 1, 0.1, size * 20);
  cam = ortho;
  controls = new OrbitControls(cam, renderer.domElement);
  controls.enableDamping = !RENDER;
  setSize(); placeCamera(VIEWS.iso);
  window.addEventListener('resize', setSize);
  loop();
  const bz = box.max.z - centre.z;
  window.U3 = { ready: true, setState, loadSim, size, front: bz, iso: VIEWS.iso.toArray(), frame: () => renderer.render(scene, cam) };
}

let spinning = false;
function loop() {
  requestAnimationFrame(loop);
  if (RENDER) return;
  if (tab === 'sim' && sim && simPlaying) { const now = performance.now(); simT += (now - simLast) / 1000; simLast = now; if (simT > sim.duration) simT = 0; simFrame(); }
  if (spinning) { const p = cam.position.clone().sub(centre); p.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.01); cam.position.copy(centre.clone().add(p)); cam.lookAt(centre); }
  controls.update(); renderer.render(scene, cam);
}

// used by the render tool: one call per frame
function setState(s) {
  if (s.dir) { const d = s.dir === 'iso' ? VIEWS.iso.clone() : new THREE.Vector3(...s.dir); placeCamera(d); }
  if (s.blend) { const d = VIEWS.iso.clone().normalize().lerp(new THREE.Vector3(...s.blend[0]).normalize(), s.blend[1]); placeCamera(d); }
  if (s.zoom) { ortho.zoom = s.zoom; ortho.updateProjectionMatrix(); }
  if (s.explode !== undefined) applyExplode(s.explode);
  if (s.section !== undefined) applySection(s.section, s.depth ?? 0);
  if (s.edges !== undefined) for (const p of parts) if (p.edges) p.edges.visible = s.edges && !p.hidden;

async function stepObjects(i) {

function buildFea() {

function feaColours(view) {
  const S = fea.surface, g = fea.gfx, part = new THREE.Color(catalogueEntry.parts.find(p => p.name === fea.part)?.colour || '#9AA6B2');
  const sfMax = 15;

  if (view === 'disp' || view === 'deformed') { vals = S.vm.map((_, i) => Math.hypot(g.U[3 * i], g.U[3 * i + 1], g.U[3 * i + 2])); hi = g.umax; }
  if (view === 'sf') { vals = S.vm.map(v => Math.min(sfMax, fea.material.yield_strength / Math.max(v, 1e-9))); lo = 0; hi = sfMax; }
  const c = new THREE.Color();

let sim = null, simIdx = 0, simT = 0, simPlaying = false, simLast = 0;

    if (p.edges) { p.edges.position.set(0, 0, 0); p.edges.quaternion.identity(); p.edges.scale.set(1, 1, 1); }
    const m = p.mats[0]; m.color.copy(p.base); m.emissive.setRGB(0, 0, 0); m.transparent = false; m.opacity = 1; m.depthWrite = true; m.needsUpdate = true;

}

    const v = keyAt(mo.keys, t, false, mo.lin), ax = glAxis(mo.axis), M = new THREE.Matrix4();

      M.makeTranslation(c.x, c.y, c.z).multiply(new THREE.Matrix4().makeRotationAxis(ax.normalize(), THREE.MathUtils.degToRad(v)))

function fillPanel(list, i, badge) {
  const s = list[i], nx = list[i + 1];
  document.getElementById('stepCount').textContent = `Step ${i + 1} of ${list.length}`;
  document.getElementById('badge').textContent = badge;
  document.getElementById('stepTitle').textContent = s.title;
  document.getElementById('cmdName').textContent = 'Command: ' + commandName(s.command);
  document.getElementById('cmdPath').textContent = s.command;
  document.getElementById('stepActions').innerHTML = s.actions.map(a => `<li>${esc(a)}</li>`).join('');
  const note = document.getElementById('stepNote'); note.textContent = s.note || ''; note.hidden = !s.note;
  document.getElementById('stepNext').innerHTML = nx ? `<b>Next:</b> ${esc(nx.title)} (${esc(commandName(nx.command))})` : '<b>Finished:</b> that is the last step.';
  document.getElementById('prev').disabled = i === 0;
  const nb = document.getElementById('next'); nb.disabled = !nx; nb.textContent = nx ? 'Next step' : 'Done';
  document.querySelectorAll('#dots button').forEach((b, k) => { b.classList.toggle('on', k === i); b.classList.toggle('done', k < i); });
  if (!RENDER) { q.set('tab', tab); q.set('step', i + 1); history.replaceState(null, '', '?' + q.toString()); }
}
function makeDots(list, go) {
  document.getElementById('dots').innerHTML = list.map((s, k) => `<button title="${esc(s.title)}">${k + 1}</button>`).join('');
  document.querySelectorAll('#dots button').forEach((b, k) => b.onclick = () => go(k));
}

async function showFea(i) {
  feaIdx = Math.max(0, Math.min(fea.steps.length - 1, i));
  fillPanel(fea.steps, feaIdx, 'Inventor Stress Analysis');
  document.getElementById('summary').innerHTML = feaSummary();
  feaView();
}
const go = d => tab === 'steps' ? showStep(stepIdx + d) : tab === 'fea' ? showFea(feaIdx + d) : tab === 'sim' ? showSim(simIdx + d) : null;

async function setTab(t) {
  try {
    if (t === 'steps' && !stepsMeta) stepsMeta = await (await fetch(`${BASE}steps/${NAME}.json`)).json();
    if (t === 'fea' && !fea) { fea = await (await fetch(`${BASE}fea/${NAME}.json`)).json(); buildFea(); }
    if (t === 'sim' && !sim) await loadSim();
  } catch (e) { caption('Not ready for this model yet'); setTimeout(() => caption(''), 1800); return; }
  if (tab === 'sim' && t !== 'sim') { togglePlay(false); simReset(); }
  if (tab === 'steps' && t !== 'steps' && stepFrameKey !== 'all') frameAll();
  if (t === 'fea' && fea.gfx.own) fea.gfx.fbox.getCenter(centre);
  else if (tab === 'fea' && fea && fea.gfx.own) { centre.copy(centre0); size = sizeA; placeCamera(VIEWS.iso); }
  tab = t;
  const guide = t === 'steps' || t === 'fea' || t === 'sim';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.body.classList.toggle('steps', guide);
  document.getElementById('steps').hidden = !guide;
  document.getElementById('changesL').hidden = t !== 'steps';
  document.getElementById('summary').hidden = t !== 'fea' && t !== 'sim';
  if (t !== 'sim') document.getElementById('simCtl').hidden = true;
  if (t !== 'fea') document.getElementById('feaCtl').hidden = true;
  root.visible = !guide || t === 'sim'; stepRoot.visible = t === 'steps'; feaRoot.visible = t === 'fea';
  if (guide) {
    applyExplode(0); document.getElementById('explode').value = 0;
    applySection(false); document.getElementById('section').checked = false;
  }
  if (t === 'fea' && fea.gfx.own) { size = fea.gfx.fsz; placeCamera(VIEWS.iso); }
  if (t === 'steps') { makeDots(stepsMeta.steps, showStep); await showStep(stepIdx); }
  if (t === 'fea') { makeDots(fea.steps, showFea); await showFea(feaIdx); }
  if (t === 'sim') { makeDots(sim.steps, showSim); showSim(simIdx); }
  setSize();
  if (!guide && !RENDER) { q.delete('tab'); q.delete('step'); history.replaceState(null, '', '?' + q.toString()); }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
new ResizeObserver(() => { if (ortho) setSize(); }).observe(document.getElementById('steps'));
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('changes').onchange = async () => applyChanges(await stepObjects(stepIdx));
document.getElementById('edges').addEventListener('change', async () => { if (stepsMeta) applyChanges(await stepObjects(stepIdx)); });
document.getElementById('defScale').oninput = () => fea && feaView();
document.getElementById('showMesh').onchange = () => fea && feaView();
window.addEventListener('keydown', e => {
  if (!['steps', 'fea', 'sim'].includes(tab) || e.target.closest('input')) return;
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
load().then(() => {
  hideMissingTabs();
  const t = q.get('tab'), n = Math.max(0, (+q.get('step') || 1) - 1);
  if (t === 'steps') { stepIdx = n; setTab('steps'); }
  if (t === 'fea') { feaIdx = n; setTab('fea'); }
  if (t === 'sim') { simIdx = n; setTab('sim'); }
});
async function loadSim() { sim = await (await fetch(`${BASE}sim/${NAME}.json`)).json(); document.getElementById('simTime').max = sim.duration; }
function hideMissingTabs() {
  fetch(`${BASE}sim/${NAME}.json`, { method: 'HEAD' }).then(r => { if (!r.ok) throw 0; }).catch(() => { document.querySelector('#tabs [data-tab=sim]').hidden = true; });
  if (catalogueEntry.fea === false) document.querySelector('#tabs [data-tab=fea]').hidden = true;
}
</script>
